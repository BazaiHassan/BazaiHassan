<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#4c1d95">
        <animate attributeName="stop-color" values="#4c1d95;#6d28d9;#4c1d95" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="260" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <circle cx="1050" cy="40" r="120" fill="#c084fc" opacity="0.18">
      <animate attributeName="r" values="110;135;110" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="230" r="90" fill="#7c3aed" opacity="0.25">
      <animate attributeName="r" values="80;105;80" dur="7s" repeatCount="indefinite"/>
    </circle>
    <path fill="#ffffff" opacity="0.07">
      <animate attributeName="d" dur="10s" repeatCount="indefinite" values="
        M0 200 C 200 160, 400 240, 600 200 S 1000 160, 1200 200 V260 H0 Z;
        M0 210 C 200 250, 400 170, 600 210 S 1000 250, 1200 210 V260 H0 Z;
        M0 200 C 200 160, 400 240, 600 200 S 1000 160, 1200 200 V260 H0 Z"/>
    </path>
    <path fill="#ffffff" opacity="0.10">
      <animate attributeName="d" dur="7s" repeatCount="indefinite" values="
        M0 225 C 300 195, 500 255, 800 225 S 1100 200, 1200 225 V260 H0 Z;
        M0 230 C 300 255, 500 205, 800 232 S 1100 255, 1200 230 V260 H0 Z;
        M0 225 C 300 195, 500 255, 800 225 S 1100 200, 1200 225 V260 H0 Z"/>
    </path>
    <text x="600" y="118" text-anchor="middle" fill="url(#txt)"
          font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="2">
      Hassan Bazai
    </text>
    <text x="600" y="168" text-anchor="middle" fill="#e9d5ff"
          font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="3">
      AI ENGINEER  •  FULL-STACK  &amp;  ANDROID DEVELOPER
    </text>
  </g>
</svg>
